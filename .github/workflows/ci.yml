name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    name: ${{ matrix.desc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            use_cpp20: "ON"
            shared: "OFF"
            desc: "Windows MSVC C++20 Static"
          - os: windows-2022
            use_cpp20: "OFF"
            shared: "OFF"
            desc: "Windows MSVC C++17 Static"
          - os: windows-2022
            use_cpp20: "ON"
            shared: "ON"
            desc: "Windows MSVC C++20 DLL"
          - os: windows-2022
            use_cpp20: "OFF"
            shared: "ON"
            desc: "Windows MSVC C++17 DLL"
          - os: ubuntu-latest
            use_cpp20: "ON"
            shared: "OFF"
            desc: "Ubuntu GCC C++20 Static"
          - os: ubuntu-latest
            use_cpp20: "OFF"
            shared: "OFF"
            desc: "Ubuntu GCC C++17 Static"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Swap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DOMEGACONF_USE_CPP20=${{ matrix.use_cpp20 }} `
            -DBUILD_SHARED_LIBS=${{ matrix.shared }} `
            -DOMEGACONF_BUILD_TESTS=ON `
            -DOMEGACONF_BUILD_SAMPLES=ON

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DOMEGACONF_USE_CPP20=${{ matrix.use_cpp20 }} \
            -DBUILD_SHARED_LIBS=${{ matrix.shared }} \
            -DOMEGACONF_BUILD_TESTS=ON \
            -DOMEGACONF_BUILD_SAMPLES=ON

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build --config Release --parallel 2

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure -C Release
